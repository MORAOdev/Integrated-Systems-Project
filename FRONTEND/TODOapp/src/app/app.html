<div class="main">
    <h1>Thiago Taveira - 204495</h1>
    <h1>Vinicius Morão - 217886</h1>
    <div *ngIf="usuarioLogado()">
      <input class="lg-text-input" #campoNovoItem (keyup.enter)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value = ''"/>
      <button class="btn-primary" (click)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value = ''">
          Adicionar Tarefa
      </button>
      <ul>
          @for (tarefaDoLoop of arrayDeTarefas(); track tarefaDoLoop) {
              <li>
                  <app-item 
                      [tarefa]="tarefaDoLoop"
                      (remover)="DELETE_tarefa($event)"
                      (modificaTarefa)="UPDATE_tarefa(tarefaDoLoop)">
                  </app-item>
              </li>
          }
      </ul>
    </div>
    <div *ngIf="!usuarioLogado()">
      <input #username placeholder="nome" class="lg-text-input" />
      <BR>
      <input #password placeholder="senha" class="lg-text-input" />
      <button class="btn-primary" >Login</button>
    </div>
</div>
